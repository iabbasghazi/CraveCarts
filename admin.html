
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraveCart Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:white;font-family:Poppins,sans-serif;padding:25px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}
h1 span{color:#ff7628}
button,select{padding:10px 13px;border:0;border-radius:7px;font:inherit}
button{cursor:pointer;background:#ff7628;color:white}
select{background:#222;color:white;border:1px solid #444}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.order{background:#171717;border:1px solid #303030;border-radius:12px;padding:18px}
.stat p{color:#aaa;font-size:13px}
.stat h2{color:#ff7628;margin-top:8px}
h3{margin-bottom:12px}
#orders{display:grid;gap:15px}
.order-head,.order-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.order p{font-size:13px;color:#bbb;margin:7px 0;overflow-wrap:anywhere}
.order strong{color:#ff7628}
.items{border-top:1px solid #333;border-bottom:1px solid #333;padding:10px 0;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.danger{background:#a72d2d}
.muted{color:#999;text-align:center;padding:30px}
.note{color:#aaa;font-size:12px;margin-top:25px;line-height:1.7}
a{color:#ff7628}
@media(max-width:600px){body{padding:15px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Crave<span>Cart.</span> Admin</h1>
  <div>
    <button onclick="loadOrders()">↻ Refresh</button>
    <button onclick="location.href='index.html'">Open Store</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><p>Total Orders</p><h2 id="count">0</h2></div>
  <div class="stat"><p>Order Value</p><h2 id="sales">₹0</h2></div>
  <div class="stat"><p>Delivered Orders</p><h2 id="delivered">0</h2></div>
</div>

<h3>Customer Orders</h3>
<div id="orders"></div>

<p class="note">
  Demo admin panel: orders are stored only in this browser's localStorage.
  This page has no admin authentication and is not secure for real customer data.
</p>

<script>
const statuses=[
  "Order Placed",
  "Confirmed",
  "Preparing",
  "Out for Delivery",
  "Delivered",
  "Cancelled"
];

function readOrders(){
  try{return JSON.parse(localStorage.getItem("cc-orders"))||[]}
  catch{return []}
}

function safe(text){
  return String(text??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function loadOrders(){
  const orders=readOrders();
  document.getElementById("count").textContent=orders.length;
  document.getElementById("sales").textContent="₹"+
    orders.reduce((sum,o)=>sum+(Number(o.total)||0),0);
  document.getElementById("delivered").textContent=
    orders.filter(o=>o.status==="Delivered").length;

  const box=document.getElementById("orders");
  if(!orders.length){
    box.innerHTML='<div class="muted">No orders yet. Place a test order in the store first.</div>';
    return;
  }

  box.innerHTML=orders.map(o=>`
    <article class="order">
      <div class="order-head">
        <strong>${safe(o.id)}</strong>
        <strong>₹${Number(o.total)||0}</strong>
      </div>
      <p>Date: ${safe(o.date)}</p>
      <p>Customer: ${safe(o.customer)}</p>
      <p>Phone: ${safe(o.phone)}</p>
      <p>Address: ${safe(o.address)}</p>
      <div class="items">
        ${(Array.isArray(o.items)?o.items:[]).map(i=>
          `<p>${safe(i.name)} × ${Number(i.qty)||0} — ₹${(Number(i.price)||0)*(Number(i.qty)||0)}</p>`
        ).join("")}
      </div>
      <p>Payment: ${safe(o.payment||"Cash on Delivery")}</p>
      <p>Current status: <strong>${safe(o.status||"Order Placed")}</strong></p>
      <div class="actions">
        <select id="status-${safe(o.id)}">
          ${statuses.map(s=>`<option value="${s}" ${s===o.status?"selected":""}>${s}</option>`).join("")}
        </select>
        <button onclick="updateStatus('${safe(o.id)}')">Update Status</button>
        <button class="danger" onclick="deleteOrder('${safe(o.id)}')">Delete</button>
      </div>
    </article>
  `).join("");
}

function updateStatus(id){
  const orders=readOrders();
  const order=orders.find(o=>o.id===id);
  if(!order)return;
  const select=document.getElementById("status-"+id);
  if(!select)return;
  order.status=select.value;
  localStorage.setItem("cc-orders",JSON.stringify(orders));
  loadOrders();
}

function deleteOrder(id){
  if(!confirm("Delete this demo order?"))return;
  const orders=readOrders().filter(o=>o.id!==id);
  localStorage.setItem("cc-orders",JSON.stringify(orders));
  loadOrders();
}

loadOrders();
</script>
</body>
</html>
