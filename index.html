
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraveCart | Veg Food Delivery</title>
<link rel="icon" href="https://i.postimg.cc/HkrL3C15/Crave-Cart-Glowing-Food-Delivery-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#141414;--orange:#ff7518;--muted:#aaa;--line:#292929}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#080808ed;border-bottom:1px solid var(--line);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:25px;font-weight:800;color:var(--orange)}.logo span{color:white}
.btn{background:var(--orange);color:#111;border:0;border-radius:9px;padding:11px 16px;font-weight:700}
.btn:hover{filter:brightness(1.12)}.outline{background:transparent;color:white;border:1px solid #555}
.hero{padding:45px 5%;background:radial-gradient(ellipse at 80% 30%,#5a230d66,transparent 50%)}
.hero h1{font-size:clamp(30px,5vw,55px);line-height:1.15;margin:0 0 12px}
.hero h1 span{color:var(--orange)}.muted{color:var(--muted)}
main{padding:15px 5% 60px}
.searchbox{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:12px 0 20px}
input,select,textarea{width:100%;padding:12px;background:#101010;color:white;border:1px solid #383838;border-radius:9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
.categories{display:flex;gap:9px;overflow:auto;padding:8px 0 18px}
.chip{white-space:nowrap;background:#171717;border:1px solid #333;color:white;padding:9px 14px;border-radius:30px}
.chip.active,.chip:hover{background:var(--orange);color:#111;border-color:var(--orange)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.product{background:var(--card);border:1px solid #242424;border-radius:14px;overflow:hidden;transition:.2s}
.product:hover{transform:translateY(-3px);border-color:#71340f}
.product img{width:100%;height:165px;object-fit:cover;background:#222}
.pbody{padding:13px}.pbody h3{font-size:15px;margin:0 0 6px}
.pbody p{font-size:12px;color:var(--muted);min-height:32px;margin:5px 0}
.price{color:var(--orange);font-weight:800;font-size:18px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.add{padding:8px 11px;border:0;border-radius:8px;background:var(--orange);font-weight:700}
.cartbar{position:fixed;bottom:15px;right:15px;z-index:6;box-shadow:0 4px 25px #000;background:var(--orange);color:#111;border:0;border-radius:30px;padding:15px 20px;font-weight:800}
.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{text-align:center;padding:25px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
/* Popup */
.modal{display:none;position:fixed;inset:0;z-index:10;background:#000d;overflow:auto;padding:20px}
.modal.show{display:flex;align-items:center;justify-content:center}
.dialog{background:#111;border:1px solid #393939;border-radius:16px;width:min(720px,100%);padding:22px;margin:auto;max-height:92vh;overflow:auto}
.dialog h2{margin:0 0 8px}.closex{float:right;background:#282828;color:white;border:0;border-radius:8px;padding:8px 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.full{grid-column:1/-1}.label{display:block;font-size:12px;color:#bbb;margin:0 0 5px}
.addresschoice{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.addresschoice label{border:1px solid #444;padding:10px;border-radius:8px;cursor:pointer}
.bill{border:1px dashed #777;padding:16px;margin-top:15px;background:#171717}
.billrow{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-bottom:1px solid #333;font-size:13px}
.billtotal{font-size:20px;color:var(--orange);font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.bottomclose{width:100%;margin-top:18px;background:#282828;color:white;border:1px solid #444;border-radius:9px;padding:12px}
@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.searchbox{grid-template-columns:1fr 1fr}}
@media(max-width:600px){header{padding:12px 4%}.logo{font-size:20px}.hero{padding:35px 5%}main{padding:12px 4%}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product img{height:125px}.pbody{padding:10px}.pbody h3{font-size:13px}.pfoot{align-items:flex-start;flex-direction:column}.searchbox{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.dialog{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="logo">Crave<span>Cart.</span></div>
  <button class="btn" onclick="openCheckout()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <p style="color:var(--orange);font-weight:700">FRESH • TASTY • VEGETARIAN</p>
  <h1>Your cravings,<br><span>delivered fresh.</span></h1>
  <p class="muted">Explore delicious vegetarian food for every mood.</p>
  <button class="btn" onclick="document.getElementById('search').focus()">Explore Menu ↓</button>
</section>

<main>
  <div class="sectionhead">
    <h2>Explore Menu</h2>
    <span class="muted" id="resultCount"></span>
  </div>
  <div class="searchbox">
    <input id="search" placeholder="🔎 Search food..." oninput="renderProducts()">
    <select id="category" onchange="renderProducts()"><option value="">All Categories</option></select>
    <select id="sort" onchange="renderProducts()">
      <option value="default">Sort: Recommended</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="az">Name: A to Z</option>
    </select>
    <select id="priceFilter" onchange="renderProducts()">
      <option value="all">Any Price</option>
      <option value="100">Under ₹100</option>
      <option value="200">Under ₹200</option>
      <option value="300">Under ₹300</option>
      <option value="500">Under ₹500</option>
    </select>
  </div>
  <div class="categories" id="chips"></div>
  <div class="products" id="products"></div>
</main>

<button class="cartbar" onclick="openCheckout()">🛒 View Cart · ₹<span id="cartTotal">0</span></button>
<footer>© 2026 CraveCart · Made with ❤️ for food lovers · Vegetarian Menu</footer>

<!-- Cart and checkout popup -->
<div class="modal" id="checkoutModal">
  <div class="dialog">
    <button class="closex" onclick="closeCheckout()">✕</button>
    <h2>🛒 Your Order</h2>
    <p class="muted">Review your cart and enter delivery details.</p>
    <div id="cartItems"></div>
    <div id="checkoutForm">
      <h3>Delivery Details</h3>
      <div class="formgrid">
        <div><label class="label">Full Name</label><input id="customerName" placeholder="Your name"></div>
        <div><label class="label">Mobile Number</label><input id="customerPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></div>
        <div class="full">
          <label class="label">Choose Address</label>
          <div class="addresschoice">
            <label><input type="radio" name="addressMode" value="same" checked onchange="addressModeChanged()" style="width:auto"> Same Address</label>
            <label><input type="radio" name="addressMode" value="new" onchange="addressModeChanged()" style="width:auto"> New Address</label>
          </div>
          <div id="savedAddressBox" class="muted"></div>
          <textarea id="address" rows="3" placeholder="House number, street, area, city, PIN code"></textarea>
        </div>
        <div class="full">
          <label class="label">Payment Method</label>
          <input value="Cash on Delivery (COD)" readonly>
        </div>
      </div>
      <button class="btn" style="width:100%" onclick="placeOrder()">Place Order · ₹<span id="checkoutTotal">0</span></button>
    </div>
    <div id="billArea"></div>
    <button class="bottomclose" onclick="closeCheckout()">Close Popup</button>
  </div>
</div>

<script>
const categories = {
 "Pizza":["Margherita Pizza","Farmhouse Pizza","Paneer Tikka Pizza","Corn Cheese Pizza","Veggie Supreme","Onion Capsicum Pizza","Cheese Burst Pizza","Mushroom Pizza","Peri Peri Pizza","Tandoori Paneer Pizza"],
 "Burger":["Classic Veg Burger","Aloo Tikki Burger","Paneer Burger","Crispy Veg Burger","Cheese Burger","Double Patty Burger","Mexican Veg Burger","Mushroom Burger","Spicy Bean Burger","Corn Cheese Burger"],
 "Indian":["Paneer Butter Masala","Shahi Paneer","Kadai Paneer","Palak Paneer","Chole Masala","Dal Makhani","Mix Veg Curry","Malai Kofta","Aloo Gobi","Rajma Masala"],
 "Rice & Biryani":["Veg Biryani","Paneer Biryani","Jeera Rice","Veg Fried Rice","Schezwan Rice","Lemon Rice","Curd Rice","Peas Pulao","Mushroom Biryani","Tawa Pulao"],
 "South Indian":["Masala Dosa","Plain Dosa","Mysore Masala Dosa","Rava Dosa","Idli Sambar","Medu Vada","Uttapam","Onion Uttapam","Paneer Dosa","Cheese Dosa"],
 "Chinese":["Veg Hakka Noodles","Schezwan Noodles","Chilli Paneer","Veg Manchurian","Crispy Corn","Spring Rolls","Chilli Potato","Honey Chilli Potato","Veg Momos","Paneer Momos"],
 "Sandwich & Wrap":["Veg Grilled Sandwich","Cheese Sandwich","Paneer Sandwich","Corn Sandwich","Aloo Wrap","Paneer Tikka Wrap","Mexican Wrap","Club Veg Sandwich","Mushroom Sandwich","Cheese Toast"],
 "Snacks":["French Fries","Peri Peri Fries","Cheese Balls","Veg Cutlet","Samosa (2 pcs)","Paneer Pakora","Onion Rings","Garlic Bread","Cheese Garlic Bread","Masala Maggi"],
 "Desserts":["Gulab Jamun","Rasgulla","Chocolate Brownie","Chocolate Cake","Vanilla Ice Cream","Chocolate Ice Cream","Kulfi","Rasmalai","Cheesecake","Choco Lava Cake"],
 "Drinks":["Masala Chai","Cold Coffee","Mango Shake","Chocolate Shake","Fresh Lime Soda","Sweet Lassi","Mango Lassi","Iced Tea","Hot Coffee","Mineral Water"]
};

const prices = {
 "Pizza":150,"Burger":80,"Indian":160,"Rice & Biryani":130,
 "South Indian":70,"Chinese":100,"Sandwich & Wrap":75,
 "Snacks":50,"Desserts":60,"Drinks":30
};
const descriptions = {
 "Pizza":"Freshly baked with delicious toppings.",
 "Burger":"A tasty vegetarian burger made fresh.",
 "Indian":"Classic Indian flavours and spices.",
 "Rice & Biryani":"Aromatic rice prepared with flavourful spices.",
 "South Indian":"Fresh South Indian favourite.",
 "Chinese":"Delicious Indo-Chinese vegetarian food.",
 "Sandwich & Wrap":"Fresh, filling and full of flavour.",
 "Snacks":"A perfect snack for any time.",
 "Desserts":"A sweet treat to complete your meal.",
 "Drinks":"A refreshing drink for your day."
};

// Build 100 vegetarian products from 10 categories.
const products = [];
let nextId = 1;
Object.entries(categories).forEach(([category,names], groupIndex) => {
  names.forEach((name,index) => {
    const price = prices[category] + (index * 17 % 90);
    products.push({
      id:nextId++, name, category, price,
      description:descriptions[category],
      imageIndex:(groupIndex * 3 + index) % 8
    });
  });
});

const foodPhotos = [
 "photo-1513104890138-7c749659a591",
 "photo-1568901346375-23c9450c58cd",
 "photo-1546069901-ba9599a7e63c",
 "photo-1540189549336-e6e99c3679fe",
 "photo-1565299624946-b28f40a0ae38",
 "photo-1512621776951-a57141f2eefd",
 "photo-1547592180-85f173990554",
 "photo-1473093295043-cdd812d0e601"
];
function foodImage(p) {
  return "https://images.unsplash.com/" + foodPhotos[p.imageIndex] +
  "?auto=format&fit=crop&w=600&q=75";
}

let cart = JSON.parse(localStorage.getItem("cc-cart") || "[]");
let activeCategory = "";
let lastOrder = null;

const categorySelect = document.getElementById("category");
Object.keys(categories).forEach(c => {
  categorySelect.add(new Option(c,c));
});

document.getElementById("chips").innerHTML =
  `<button class="chip active" onclick="setCategory('',this)">All Food</button>` +
  Object.keys(categories).map(c =>
    `<button class="chip" onclick="setCategory('${c}',this)">${c}</button>`
  ).join("");

function setCategory(category,button) {
  activeCategory = category;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  button.classList.add("active");
  categorySelect.value = category;
  renderProducts();
}

function renderProducts() {
  const query = document.getElementById("search").value.toLowerCase().trim();
  const category = categorySelect.value || activeCategory;
  const priceMax = document.getElementById("priceFilter").value;
  let list = products.filter(p =>
    (p.name.toLowerCase().includes(query) ||
     p.category.toLowerCase().includes(query) ||
     p.description.toLowerCase().includes(query)) &&
    (!category || p.category === category) &&
    (priceMax === "all" || p.price < Number(priceMax))
  );

  const sort = document.getElementById("sort").value;
  if(sort==="low") list.sort((a,b)=>a.price-b.price);
  if(sort==="high") list.sort((a,b)=>b.price-a.price);
  if(sort==="az") list.sort((a,b)=>a.name.localeCompare(b.name));

  document.getElementById("resultCount").textContent =
    `${list.length} vegetarian items`;
  document.getElementById("products").innerHTML = list.length ? list.map(p=>`
    <article class="product">
      <img src="${foodImage(p)}" alt="${p.name}" loading="lazy">
      <div class="pbody">
        <h3>${p.name}</h3>
        <span class="muted" style="font-size:11px">${p.category} · 🟢 Veg</span>
        <p>${p.description}</p>
        <div class="pfoot">
          <span class="price">₹${p.price}</span>
          <button class="add" onclick="addToCart(${p.id})">+ Add</button>
        </div>
      </div>
    </article>`).join("") :
    `<div class="empty">No items found. Try another search.</div>`;
}

function saveCart() {
  localStorage.setItem("cc-cart",JSON.stringify(cart));
  updateCart();
}
function addToCart(id) {
  const item = cart.find(x=>x.id===id);
  if(item) item.qty++;
  else cart.push({id,qty:1});
  saveCart();
}
function changeQty(id,change) {
  const item = cart.find(x=>x.id===id);
  if(!item) return;
  item.qty += change;
  if(item.qty<=0) cart=cart.filter(x=>x.id!==id);
  saveCart();
  renderCart();
}
function cartDetails() {
  return cart.map(item=>{
    const p=products.find(x=>x.id===item.id);
    return p ? {...p,qty:item.qty} : null;
  }).filter(Boolean);
}
function subtotal() {
  return cartDetails().reduce((sum,p)=>sum+p.price*p.qty,0);
}
function deliveryFee() {
  return subtotal()===0 || subtotal()>=499 ? 0 : 40;
}
function total() {
  return subtotal()+deliveryFee();
}
function updateCart() {
  const count=cart.reduce((s,x)=>s+x.qty,0);
  document.getElementById("cartCount").textContent=count;
  document.getElementById("cartTotal").textContent=total();
  document.getElementById("checkoutTotal").textContent=total();
}
function openCheckout() {
  document.getElementById("checkoutModal").classList.add("show");
  document.getElementById("billArea").innerHTML="";
  document.getElementById("checkoutForm").style.display="block";
  renderCart();
  loadAddress();
}
function closeCheckout() {
  document.getElementById("checkoutModal").classList.remove("show");
}
function renderCart() {
  const details=cartDetails();
  document.getElementById("cartItems").innerHTML=details.length ?
    details.map(p=>`
      <div class="billrow">
        <span>${p.name}<br><small class="muted">₹${p.price} × ${p.qty}</small></span>
        <span>₹${p.price*p.qty}
          <br><button class="outline" onclick="changeQty(${p.id},-1)">−</button>
          <button class="outline" onclick="changeQty(${p.id},1)">+</button>
        </span>
      </div>`).join("")+
      `<div class="billrow"><span>Subtotal</span><b>₹${subtotal()}</b></div>
       <div class="billrow"><span>Delivery</span><b>${deliveryFee()===0?"FREE":"₹"+deliveryFee()}</b></div>
       <div class="billrow"><b>Total</b><b class="billtotal">₹${total()}</b></div>` :
      `<p class="empty">Your cart is empty. Add some vegetarian food first!</p>`;
  updateCart();
}
function loadAddress() {
  const saved=JSON.parse(localStorage.getItem("cc-address")||"null");
  document.getElementById("savedAddressBox").textContent =
    saved ? "Saved address: "+saved : "No saved address yet.";
  document.getElementById("address").value=saved||"";
  document.querySelector('input[name="addressMode"][value="same"]').checked=true;
  document.getElementById("address").readOnly=!!saved;
}
function addressModeChanged() {
  const mode=document.querySelector('input[name="addressMode"]:checked').value;
  const saved=localStorage.getItem("cc-address");
  const field=document.getElementById("address");
  field.readOnly=mode==="same" && !!saved;
  if(mode==="same") field.value=saved||"";
  else field.value="";
  field.placeholder=mode==="same"?"Your saved address":"Enter your new delivery address";
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function placeOrder() {
  const details=cartDetails();
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("address").value.trim();
  if(!details.length) return alert("Please add food to your cart.");
  if(!name) return alert("Please enter your name.");
  if(!/^[0-9]{10}$/.test(phone)) return alert("Enter a valid 10-digit mobile number.");
  if(address.length<8) return alert("Please enter your complete address.");

  localStorage.setItem("cc-address",address);
  const order={
    id:"CC"+Date.now().toString().slice(-8),
    date:new Date().toLocaleString(),
    name,phone,address,payment:"Cash on Delivery",
    status:"Order Placed",
    items:details.map(p=>({id:p.id,name:p.name,price:p.price,qty:p.qty})),
    subtotal:subtotal(),delivery:deliveryFee(),total:total()
  };
  const orders=JSON.parse(localStorage.getItem("cc-orders")||"[]");
  orders.unshift(order);
  localStorage.setItem("cc-orders",JSON.stringify(orders));
  lastOrder=order;
  cart=[];
  saveCart();
  renderCart();
  document.getElementById("checkoutForm").style.display="none";
  document.getElementById("billArea").innerHTML=makeBill(order);
}

function makeBill(o) {
  return `<div class="bill" id="printBill">
    <h2 style="color:var(--orange)">CraveCart</h2>
    <p><b>Order Bill</b> · Demo receipt — not a tax invoice</p>
    <div class="billrow"><span>Order ID</span><b>${escapeHTML(o.id)}</b></div>
    <div class="billrow"><span>Date</span><span>${escapeHTML(o.date)}</span></div>
    <div class="billrow"><span>Customer</span><span>${escapeHTML(o.name)}</span></div>
    <div class="billrow"><span>Phone</span><span>${escapeHTML(o.phone)}</span></div>
    <div class="billrow"><span>Address</span><span>${escapeHTML(o.address)}</span></div>
    ${o.items.map(p=>`<div class="billrow"><span>${escapeHTML(p.name)} × ${p.qty}</span><b>₹${p.price*p.qty}</b></div>`).join("")}
    <div class="billrow"><span>Subtotal</span><b>₹${o.subtotal}</b></div>
    <div class="billrow"><span>Delivery</span><b>${o.delivery?"₹"+o.delivery:"FREE"}</b></div>
    <div class="billrow"><span>Payment</span><b>Cash on Delivery</b></div>
    <div class="billrow"><b>Grand Total</b><b class="billtotal">₹${o.total}</b></div>
    <p style="text-align:center">Thank you for choosing CraveCart!</p>
  </div>
  <div class="actions">
    <button class="btn" onclick="downloadBill()">⬇ Download / Save PDF</button>
    <button class="btn outline" onclick="printBill()">🖨 Print Bill</button>
    <button class="btn outline" onclick="newOrder()">Order More</button>
  </div>`;
}

function printBill() {
  const bill=document.getElementById("printBill");
  if(!bill) return;
  const win=window.open("","_blank");
  if(!win) return alert("Please allow popups to print the bill.");
  win.document.write(`<!doctype html><html><head><title>CraveCart Bill</title>
    <style>body{font-family:Arial;padding:25px;color:#111;max-width:650px;margin:auto}
    .billrow{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #ddd}
    .billtotal{font-size:20px}h2{color:#f60}</style></head><body>${bill.innerHTML}</body></html>`);
  win.document.close();
  win.focus();
  win.print();
}
function downloadBill() {
  // Opens the print dialog; select "Save as PDF" to download the bill.
  printBill();
}
function newOrder() {
  document.getElementById("billArea").innerHTML="";
  document.getElementById("checkoutForm").style.display="block";
  loadAddress();
  renderCart();
}

renderProducts();
updateCart();
</script>
</body>
</html>
