
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraveCart | Food Delivery</title>
<link rel="icon" href="https://i.postimg.cc/HkrL3C15/Crave-Cart-Glowing-Food-Delivery-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#0b0b0b;color:white}
button,input{font:inherit}
button{cursor:pointer;border:0}
header{display:flex;justify-content:space-between;align-items:center;
padding:18px 7%;border-bottom:1px solid #292929;position:sticky;
top:0;background:#0b0b0bf2;z-index:5}
.logo{font-size:25px;font-weight:800;color:#ff7628}
.logo span{color:white}
.cart-btn,.primary{background:#ff7628;color:white;padding:11px 17px;
border-radius:10px;font-weight:600}
.hero{padding:65px 7%;background:radial-gradient(ellipse at top right,#47200e,#0b0b0b 65%)}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.15;max-width:650px}
.hero h1 span{color:#ff7628}
.hero p{color:#aaa;margin:18px 0 25px}
.search{width:100%;max-width:500px;padding:14px;border-radius:10px;
border:1px solid #333;background:#171717;color:white;outline:none}
section.menu{padding:35px 7%}
.menu h2{font-size:28px;margin-bottom:20px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.cat{background:#1b1b1b;color:#ddd;padding:9px 16px;border-radius:20px}
.cat.active,.cat:hover{background:#ff7628;color:white}
.layout{display:grid;grid-template-columns:1fr 300px;gap:25px;align-items:start}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:#171717;border:1px solid #292929;border-radius:15px;
overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#ff7628}
.card img{width:100%;height:155px;object-fit:cover;background:#222}
.info{padding:13px}
.info h3{font-size:15px;margin-bottom:5px}
.info small{color:#999}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.price{color:#ff7628;font-weight:700}
.add{background:#ff7628;color:white;border-radius:8px;padding:8px 12px}
.cart{background:#171717;border:1px solid #292929;border-radius:15px;
padding:18px;position:sticky;top:90px}
.cart h2{font-size:22px;margin-bottom:15px}
.cart-items{display:grid;gap:14px}
.cart-item{border-bottom:1px solid #333;padding-bottom:12px}
.item-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.item-top button{background:none;color:#ff6b6b}
.qty{display:flex;align-items:center;gap:12px;margin-top:8px}
.qty button{background:#292929;color:white;width:27px;height:27px;border-radius:6px}
.cart-bottom{border-top:1px solid #333;margin-top:16px;padding-top:15px}
.total{display:flex;justify-content:space-between;font-weight:700;margin:12px 0}
.cart-action{width:100%;padding:11px;border-radius:9px;margin-top:9px;font-weight:600}
.checkout{background:#ff7628;color:white}
.clear{background:#292929;color:white}
.empty{text-align:center;color:#888;padding:20px 0;font-size:14px}
footer{text-align:center;color:#777;padding:28px;border-top:1px solid #292929;margin-top:35px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#ff7628;color:white;padding:12px 20px;border-radius:9px;
display:none;z-index:10;box-shadow:0 5px 25px #0008}
@media(max-width:1050px){
.layout{grid-template-columns:1fr}
.cart{position:static}
.products{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
header{padding:15px 5%}
.hero{padding:45px 5%}
section.menu{padding:25px 5%}
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card img{height:125px}
.info{padding:10px}
.info h3{font-size:13px}
.cart{padding:14px}
}
@media(max-width:360px){
.products{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="logo">Crave<span>Cart.</span></div>
  <button class="cart-btn" onclick="goCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<div class="hero">
  <h1>Good food. <span>Good mood.</span></h1>
  <p>Your cravings, delivered one delicious bite at a time.</p>
  <input class="search" id="search" placeholder="🔍 Search your favourite food..."
  oninput="renderFoods()">
</div>

<section class="menu">
  <h2>Explore Our Menu 🍽️</h2>
  <div class="categories" id="categories"></div>
  <div class="layout">
    <div class="products" id="products"></div>

    <aside class="cart" id="cart">
      <h2>🛒 Your Cart</h2>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-bottom">
        <div class="total"><span>Subtotal</span><span id="subtotal">₹0</span></div>
        <div class="total"><span>Delivery</span><span id="delivery">₹0</span></div>
        <div class="total"><span>Total</span><span id="total">₹0</span></div>
        <button class="cart-action checkout" onclick="checkout()">Place Order</button>
        <button class="cart-action clear" onclick="clearCart()">Clear Cart</button>
      </div>
    </aside>
  </div>
</section>

<footer>© 2026 CraveCart | Made with ❤️ for food lovers</footer>
<div id="toast"></div>

<script>
// 1. FOOD MENU: 30 PRODUCTS
const foods = [
  
{id:2,name:"Paneer Butter Masala",price:199,cat:"Indian",img:"photo-1631452180519-c014fe946bc7"},
{id:3,name:"Masala Dosa",price:99,cat:"Indian",img:"photo-1589301760014-d929f3979dbc"},
{id:4,name:"Chole Bhature",price:129,cat:"Indian",img:"photo-1626132647523-66f5bf380027"},
{id:5,name:"Veg Thali",price:179,cat:"Indian",img:"photo-1546833999-b9f581a1996d"},
{id:6,name:"Samosa",price:30,cat:"Snacks",img:"photo-1601050690597-df0568f70950"},
{id:7,name:"Spring Rolls",price:119,cat:"Snacks",img:"photo-1544025162-d76694265947"},
{id:8,name:"French Fries",price:89,cat:"Snacks",img:"photo-1573080496219-bb080dd4f877"},
{id:9,name:"Veg Sandwich",price:99,cat:"Snacks",img:"photo-1528735602780-2552fd46c7af"},
{id:10,name:"Margherita Pizza",price:179,cat:"Pizza",img:"photo-1579751626657-72bc17010498"},
{id:11,name:"Farmhouse Pizza",price:249,cat:"Pizza",img:"photo-1513104890138-7c749659a591"},
{id:12,name:"Cheese Burst Pizza",price:279,cat:"Pizza",img:"photo-1571407970349-bc81e7e96d47"},
{id:13,name:"Classic Burger",price:129,cat:"Burger",img:"photo-1568901346375-23c9450c58cd"},

{id:15,name:"Chicken Burger",price:179,cat:"Burger",img:"photo-1571091718767-18b5b1457add"},
{id:16,name:"White Sauce Pasta",price:169,cat:"Pasta",img:"photo-1473093295043-cdd812d0e601"},
{id:17,name:"Red Sauce Pasta",price:159,cat:"Pasta",img:"photo-1551183053-bf91a1d81141"},
{id:18,name:"Chocolate Brownie",price:99,cat:"Dessert",img:"photo-1606313564200-e75d5e30476c"},
{id:19,name:"Chocolate Cake",price:129,cat:"Dessert",img:"photo-1578985545062-69928b1d9587"},
{id:20,name:"Vanilla Ice Cream",price:79,cat:"Dessert",img:"photo-1563805042-7684c019e1cb"},
{id:21,name:"Chocolate Milkshake",price:119,cat:"Drinks",img:"photo-1572490122747-3968b75cc699"},
{id:22,name:"Cold Coffee",price:99,cat:"Drinks",img:"photo-1461023058943-07fcbe16d735"},

{id:24,name:"Mango Smoothie",price:129,cat:"Drinks",img:"photo-1505252585461-04db1eb84625"},
{id:25,name:"Chicken Momos",price:139,cat:"Snacks",img:"photo-1563245372-f21724e3856d"},
{id:26,name:"Hakka Noodles",price:149,cat:"Chinese",img:"photo-1585032226651-759b368d7246"},
{id:27,name:"Veg Fried Rice",price:139,cat:"Chinese",img:"photo-1603133872878-684f208fb84b"},
{id:28,name:"Manchurian",price:149,cat:"Chinese",img:"photo-1512058564366-18510be2db19"},
{id:29,name:"Grilled Cheese Sandwich",price:119,cat:"Snacks",img:"photo-1528735602780-2552fd46c7af"},
{id:30,name:"Strawberry Shake",price:119,cat:"Drinks",img:"photo-1553530666-ba11a7da3888"}
].map(f=>({...f,img:`https://images.unsplash.com/${f.img}?auto=format&fit=crop&w=600&q=80`}));

// 2. APP STATE
let category = "All";
let cart = JSON.parse(localStorage.getItem("cravecart") || "{}");

// 3. CREATE CATEGORY BUTTONS
function renderCategories(){
  const cats = ["All",...new Set(foods.map(f=>f.cat))];
  document.getElementById("categories").innerHTML = cats.map(c=>
    `<button class="cat ${category===c?"active":""}"
    onclick="setCategory('${c}')">${c}</button>`
  ).join("");
}

function setCategory(c){
  category=c;
  renderCategories();
  renderFoods();
}

// 4. DISPLAY FOOD CARDS
function renderFoods(){
  const query=document.getElementById("search").value.toLowerCase();
  const list=foods.filter(f=>
    (category==="All"||f.cat===category) &&
    f.name.toLowerCase().includes(query)
  );
  document.getElementById("products").innerHTML=list.length?list.map(f=>`
    <article class="card">
      <img src="${f.img}" alt="${f.name}" loading="lazy">
      <div class="info">
        <h3>${f.name}</h3>
        <small>${f.cat}</small>
        <div class="price-row">
          <span class="price">₹${f.price}</span>
          <button class="add" onclick="addToCart(${f.id})">+ Add</button>
        </div>
      </div>
    </article>`).join(""):`<p>No food found.</p>`;
}

// 5. CART FUNCTIONS
function saveCart(){
  localStorage.setItem("cravecart",JSON.stringify(cart));
  renderCart();
}

function addToCart(id){
  cart[id]=(cart[id]||0)+1;
  saveCart();
  toast("Added to cart!");
}

function changeQty(id,amount){
  cart[id]=(cart[id]||0)+amount;
  if(cart[id]<=0) delete cart[id];
  saveCart();
}

function clearCart(){
  cart={};
  saveCart();
  toast("Cart cleared!");
}

function renderCart(){
  let subtotal=0,count=0;
  const items=foods.filter(f=>cart[f.id]>0);

  document.getElementById("cartItems").innerHTML=items.length?
  items.map(f=>{
    const qty=cart[f.id];
    subtotal+=f.price*qty;
    count+=qty;
    return `<div class="cart-item">
      <div class="item-top">
        <span>${f.name}</span>
        <button onclick="changeQty(${f.id},-${qty})">Remove</button>
      </div>
      <div class="item-top">
        <span>₹${f.price*qty}</span>
        <div class="qty">
          <button onclick="changeQty(${f.id},-1)">−</button>
          <span>${qty}</span>
          <button onclick="changeQty(${f.id},1)">+</button>
        </div>
      </div>
    </div>`;
  }).join(""):`<div class="empty">Your cart is empty 🛒<br>Add something tasty!</div>`;

  const delivery=subtotal===0||subtotal>=499?0:40;
  document.getElementById("count").textContent=count;
  document.getElementById("subtotal").textContent="₹"+subtotal;
  document.getElementById("delivery").textContent=delivery===0?"FREE":"₹"+delivery;
  document.getElementById("total").textContent="₹"+(subtotal+delivery);
}

// 6. CHECKOUT DEMO
function checkout(){
  const items=foods.filter(f=>cart[f.id]>0);
  if(!items.length){toast("Please add food first!");return;}
  const subtotal=items.reduce((sum,f)=>sum+f.price*cart[f.id],0);
  const delivery=subtotal>=499?0:40;
  alert("CraveCart Order Summary\n\nItems: "+
    items.reduce((n,f)=>n+cart[f.id],0)+
    "\nSubtotal: ₹"+subtotal+
    "\nDelivery: ₹"+delivery+
    "\nTotal: ₹"+(subtotal+delivery)+
    "\n\nDemo only — no real order was placed.");
}

function goCart(){
  document.getElementById("cart").scrollIntoView({behavior:"smooth"});
}

function toast(message){
  const box=document.getElementById("toast");
  box.textContent=message;
  box.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>box.style.display="none",1800);
}

// 7. START APP
renderCategories();
renderFoods();
renderCart();
</script>
</body>
</html>
